<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MST 채굴 시험</title>
  <meta name="description" content="MST(머스트셈) 채굴 처리량 시험 대시보드" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232456d6'/%3E%3Cpath d='M8 23V9l8 8 8-8v14' fill='none' stroke='white' stroke-width='3' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1 data-i18n="title">MST 채굴 시험</h1>
      <p data-i18n="subtitle"></p>
    </div>
    <div class="top-actions">
      <button id="langBtn" class="ghost" type="button" aria-label="Language">EN</button>
      <button id="connectBtn" class="primary" type="button" data-i18n="connect">지갑 연결</button>
    </div>
  </header>

  <div id="banners"></div>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="mine" class="active" data-i18n="tabMine"></button>
    <button role="tab" data-tab="stats" data-i18n="tabStats"></button>
    <button role="tab" data-tab="history" data-i18n="tabHistory"></button>
    <button role="tab" data-tab="admin" data-i18n="tabAdmin" hidden id="adminTabBtn"></button>
    <button role="tab" data-tab="notice" data-i18n="tabNotice"></button>
  </nav>

  <main>
    <!-- ───────── 채굴 ───────── -->
    <section id="tab-mine" class="tab active">
      <div class="card status-card">
        <div>
          <div class="muted small" data-i18n="deviceStatus"></div>
          <div id="deviceStatus" class="status-line"></div>
          <div id="modeLine" class="small"></div>
        </div>
        <div class="run-state" id="runState"><span class="dot"></span><span id="runStateText" data-i18n="idle"></span></div>
      </div>

      <div class="card">
        <div class="controls">
          <label>
            <span data-i18n="threads"></span>
            <select id="threadsSel"></select>
          </label>
          <label>
            <span data-i18n="cpuCap"></span>
            <select id="cpuSel">
              <option value="25">25%</option>
              <option value="50" selected>50%</option>
              <option value="75">75%</option>
              <option value="100">100%</option>
            </select>
          </label>
        </div>
        <label class="check"><input type="checkbox" id="pauseHidden" checked /> <span data-i18n="pauseHidden"></span></label>
        <label class="check"><input type="checkbox" id="skipNoReward" checked /> <span data-i18n="skipNoReward"></span></label>
        <button id="startBtn" class="primary big" type="button" data-i18n="start"></button>
      </div>

      <div class="grid live">
        <div class="tile"><div class="k" data-i18n="hashrate"></div><div class="v" id="liveHps">0 H/s</div></div>
        <div class="tile"><div class="k" data-i18n="sessionHashes"></div><div class="v" id="liveHashes">0</div></div>
        <div class="tile"><div class="k" data-i18n="found"></div><div class="v" id="liveFound">0</div></div>
        <div class="tile"><div class="k"><span data-i18n="submitted"></span> / <span data-i18n="accepted"></span></div><div class="v" id="liveSubmitted">0 / 0</div></div>
        <div class="tile"><div class="k" data-i18n="nextSubmit"></div><div class="v" id="liveNext">–</div></div>
      </div>

      <div class="card" id="rewardModeCard" hidden>
        <h3 data-i18n="rewardMode"></h3>
        <label class="check"><input type="radio" name="rmode" value="0" checked /> <span data-i18n="rmWallet"></span></label>
        <label class="check"><input type="radio" name="rmode" value="1" id="rmStake" /> <span data-i18n="rmStake"></span></label>
        <p class="muted small" id="rmStakeOff" data-i18n="rmStakeOff"></p>
        <button id="saveModeBtn" type="button" data-i18n="save"></button>
      </div>

      <div class="card" id="applyCard" hidden>
        <h3 data-i18n="applyTitle"></h3>
        <p class="muted small" data-i18n="applyHint"></p>
        <div class="row">
          <input id="applyLabel" maxlength="64" data-i18n-ph="applyLabel" />
          <button id="applyBtn" type="button" data-i18n="applyBtn"></button>
        </div>
      </div>

      <div class="card">
        <h3 data-i18n="log"></h3>
        <ol id="activityLog" class="log"></ol>
      </div>
    </section>

    <!-- ───────── 대시보드 ───────── -->
    <section id="tab-stats" class="tab">
      <div class="section-head">
        <span class="muted small" id="statsUpdated"></span>
        <button id="refreshBtn" class="ghost" type="button" data-i18n="refresh"></button>
      </div>
      <div class="grid">
        <div class="tile"><div class="k" data-i18n="hashrate"></div><div class="v" id="sHps">–</div></div>
        <div class="tile"><div class="k" data-i18n="cumHashes"></div><div class="v" id="sCum">–</div></div>
        <div class="tile"><div class="k"><span data-i18n="submitted"></span> / <span data-i18n="accepted"></span></div><div class="v" id="sSubAcc">–</div></div>
        <div class="tile"><div class="k" data-i18n="myShares"></div><div class="v" id="sMyShares">–</div></div>
        <div class="tile"><div class="k" data-i18n="receivedMst"></div><div class="v" id="sReceived">–</div></div>
        <div class="tile"><div class="k" data-i18n="stakedMst"></div><div class="v" id="sStaked">–</div></div>
        <div class="tile"><div class="k" data-i18n="todayPaid"></div><div class="v" id="sToday">–</div></div>
        <div class="tile"><div class="k" data-i18n="difficulty"></div><div class="v" id="sDiff">–</div><div class="sub muted" data-i18n="difficultyUnit"></div></div>
        <div class="tile"><div class="k" data-i18n="expectedTime"></div><div class="v" id="sExpect">–</div></div>
        <div class="tile"><div class="k" data-i18n="poolBalance"></div><div class="v" id="sPool">–</div></div>
        <div class="tile"><div class="k" data-i18n="rewardPerShare"></div><div class="v" id="sReward">–</div></div>
        <div class="tile"><div class="k" data-i18n="epoch"></div><div class="v" id="sEpoch">–</div></div>
        <div class="tile"><div class="k" data-i18n="epochProgress"></div><div class="v" id="sEpochProg">–</div></div>
        <div class="tile"><div class="k" data-i18n="devices"></div><div class="v" id="sDevices">–</div></div>
        <div class="tile"><div class="k" data-i18n="networkShares"></div><div class="v" id="sNetShares">–</div></div>
      </div>
    </section>

    <!-- ───────── 기록 ───────── -->
    <section id="tab-history" class="tab">
      <div class="section-head">
        <h3 data-i18n="histTitle"></h3>
        <button id="histRefreshBtn" class="ghost" type="button" data-i18n="refresh"></button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th data-i18n="colBlock"></th><th data-i18n="colTime"></th><th data-i18n="colHash"></th><th class="num" data-i18n="colReward"></th></tr></thead>
          <tbody id="histBody"></tbody>
        </table>
      </div>
    </section>

    <!-- ───────── 관리자 ───────── -->
    <section id="tab-admin" class="tab">
      <div class="card">
        <h3 data-i18n="adminDevices"></h3>
        <div class="row">
          <input id="regAddr" placeholder="0x…" data-i18n-ph="address" />
          <input id="regLabel" maxlength="64" data-i18n-ph="label" />
          <button id="regBtn" type="button" data-i18n="register"></button>
          <button id="unregBtn" class="danger" type="button" data-i18n="unregister"></button>
        </div>
        <label class="stack"><span class="small muted" data-i18n="batchRegister"></span>
          <textarea id="batchInput" rows="3" placeholder="0xabc…,laptop-01"></textarea>
        </label>
        <button id="batchBtn" type="button" data-i18n="register"></button>

        <h4 data-i18n="pendingRequests"></h4>
        <ul id="pendingList" class="plain"></ul>
        <h4 data-i18n="registeredList"></h4>
        <ul id="registeredList" class="plain"></ul>
      </div>

      <div class="card">
        <h3 data-i18n="adminPool"></h3>
        <div class="row">
          <input id="poolAmount" type="number" min="0" step="any" data-i18n-ph="amountMst" />
          <button id="fundBtn" type="button" data-i18n="fund"></button>
          <button id="withdrawBtn" class="danger" type="button" data-i18n="withdraw"></button>
        </div>
      </div>

      <div class="card">
        <h3 data-i18n="adminParams"></h3>
        <div class="form-grid">
          <label><span data-i18n="pRewardPerShare"></span><input id="pReward" type="number" min="0" step="any" /></label>
          <label><span data-i18n="pDailyCap"></span><input id="pDaily" type="number" min="0" step="any" /></label>
          <label><span data-i18n="pEpochCap"></span><input id="pEpoch" type="number" min="0" step="any" /></label>
          <label><span data-i18n="pTargetInterval"></span><input id="pInterval" type="number" min="1" step="1" /></label>
          <label><span data-i18n="pSharesPerEpoch"></span><input id="pPerEpoch" type="number" min="1" step="1" /></label>
          <label><span data-i18n="pMinShareInterval"></span><input id="pMinInt" type="number" min="0" step="1" /></label>
        </div>
        <button id="paramsBtn" type="button" data-i18n="applyParams"></button>
      </div>

      <div class="card">
        <h3 data-i18n="adminDifficulty"></h3>
        <p class="muted small" data-i18n="targetHint"></p>
        <div class="row">
          <input id="hpsInput" type="number" min="1" step="any" data-i18n-ph="expectedHps" />
          <button id="targetBtn" type="button" data-i18n="setTarget"></button>
        </div>
        <p class="small mono" id="targetPreview"></p>
      </div>

      <div class="card">
        <h3 data-i18n="adminOps"></h3>
        <label class="check"><input type="checkbox" id="stakingToggle" /> <span data-i18n="stakingEnabled"></span></label>
        <div class="row">
          <button id="pauseBtn" class="danger" type="button" data-i18n="pause"></button>
          <button id="unpauseBtn" type="button" data-i18n="unpause"></button>
        </div>
      </div>
    </section>

    <!-- ───────── 위험 고지 ───────── -->
    <section id="tab-notice" class="tab">
      <div class="card notice">
        <h3 data-i18n="noticeTitle"></h3>
        <p data-i18n="noticeIntro"></p>
        <h4 data-i18n="riskTech"></h4><p data-i18n="riskTechBody"></p>
        <h4 data-i18n="riskContract"></h4><p data-i18n="riskContractBody"></p>
        <h4 data-i18n="riskKey"></h4><p data-i18n="riskKeyBody"></p>
        <h4 data-i18n="riskValue"></h4><p data-i18n="riskValueBody"></p>
        <h4 data-i18n="riskParticipation"></h4><p data-i18n="riskParticipationBody"></p>
        <p class="muted small mono" id="contractInfo"></p>
      </div>
    </section>
  </main>

  <dialog id="consentDlg">
    <form method="dialog">
      <h3 data-i18n="consentTitle"></h3>
      <label class="check"><input type="checkbox" class="consent" /> <span data-i18n="consentPower"></span></label>
      <label class="check"><input type="checkbox" class="consent" /> <span data-i18n="consentValue"></span></label>
      <label class="check"><input type="checkbox" class="consent" /> <span data-i18n="consentStop"></span></label>
      <div class="row end">
        <button value="cancel" class="ghost" data-i18n="cancel"></button>
        <button value="ok" id="consentOk" class="primary" disabled data-i18n="consentAgree"></button>
      </div>
    </form>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
